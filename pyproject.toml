[project]
name = "von-mlx"
version = "1.0.0"
description = "Apple Silicon (MLX) port of wfzyx/von-1.0 — non-autoregressive System One decision model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MLX port; original model by Victor Panisa (wfzyx)" }]
keywords = ["mlx", "apple-silicon", "modernbert", "classification", "decision", "nli", "encoder"]

dependencies = [
    "mlx>=0.29",
    "numpy",
    "transformers>=4.48",
    "pydantic>=2.0",
    "fastapi>=0.110",
]

[project.optional-dependencies]
# torch is used only by the converter and the verification scripts
convert = ["torch>=2.0", "safetensors"]
serve = ["uvicorn>=0.28", "httpx"]
mcp = ["mcp>=1.0"]

[project.scripts]
von-mlx = "von_mlx.cli:main"
von-mlx-mcp = "von_mlx.mcp_server:main"

[tool.setuptools.packages.find]
include = ["von_mlx*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
